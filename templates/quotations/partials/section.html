<div class="card" style="margin-bottom: 2rem;" id="section-{{ section.pk }}">
    <div class="flex-responsive" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
        <h3 style="color: var(--accent-color);">{{ section.name }}</h3>
        <h3 id="section-total-{{ section.pk }}">&#8377; {{ section.section_total }}</h3>
    </div>
    
    <div class="table-responsive">
        <table class="builder-table">
            <thead>
                <tr>
                    <th style="width: 25%;">Description</th>
                    <th style="width: 15%;">Type</th>
                    <th style="width: 10%;" class="text-center">L (ft.in)</th>
                    <th style="width: 10%;" class="text-center">W (ft.in)</th>
                    <th style="width: 10%;" class="text-center">Size (Sq.ft)</th>
                    <th style="width: 10%;" class="text-center">Qty</th>
                    <th style="width: 10%;" class="text-right">Rate (&#8377;)</th>
                    <th style="width: 10%;" class="text-right">Amount (&#8377;)</th>
                </tr>
            </thead>
            <tbody id="items-container-{{ section.pk }}">
                {% for item in section.items.all %}
                    {% include 'quotations/partials/item_row.html' %}
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <div style="margin-top: 1rem;">
        <form hx-post="{% url 'htmx_add_item' section.pk %}" hx-target="#items-container-{{ section.pk }}" hx-swap="beforeend">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.75rem;">+ Add Item</button>
        </form>
    </div>
</div>
