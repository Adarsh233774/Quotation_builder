{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 2rem;">New Client</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Client Name</label>
            <input type="text" name="name" required placeholder="e.g. John Doe">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Company (Optional)</label>
            <input type="text" name="company" placeholder="e.g. Acme Corp">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Email (Optional)</label>
            <input type="email" name="email" placeholder="e.g. john@acme.com">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Phone (Optional)</label>
            <input type="text" name="phone" placeholder="e.g. 555-1234">
        </div>

        <div style="margin-bottom: 2rem;">
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Address (Optional)</label>
            <textarea name="address" rows="3" placeholder="123 Main St..."></textarea>
        </div>
        
        <button type="submit" class="btn">Create Client</button>
    </form>
</div>
{% endblock %}
